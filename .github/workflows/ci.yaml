name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No python-version: uv takes it from .python-version, the one pin.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          # Distinguishes this job's cache key from the pytest job on the same Python. Without
          # it both race on the same key and one fails to save.
          cache-suffix: lint
      # The ruff and ty hooks are `uv run --no-sync`, so the venv must exist
      # before prek runs.
      # --locked, not --frozen: --frozen installs from the lockfile without
      # checking it is current, so drift merges silently. Expect one red run
      # on a Release PR -- release-please pushes the version bump, this fails,
      # then release.yaml's sync-lockfile commits the lockfile and it passes.
      - run: uv sync --locked
      # Runs the hooks from .pre-commit-config.yaml rather than repeating them
      # here, so local and CI cannot drift.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.10
          # Turns on jactionlint's online rules, which need the API; local hooks stay offline.
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ env.PREK_VERSION }}

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The supported range, matching requires-python, not a pin: widen it by hand when
        # a Python is added to or dropped from support.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  # Aggregator. The branch ruleset requires this exact check name, so the
  # matrix can grow without touching branch protection.
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [lint, pytest]
    if: always()
    steps:
      - name: aggregate
        env:
          LINT: ${{ needs.lint.result }}
          PYTEST: ${{ needs.pytest.result }}
        run: |
          set -euo pipefail
          if [[ "$LINT" != "success" || "$PYTEST" != "success" ]]; then
            echo "lint=$LINT pytest=$PYTEST"
            exit 1
          fi
          echo "all green"

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is dead: last commit
      # 2025-01-14, no releases, and it pins @commitlint/ensure ^19 -- which
      # predates the exemption for long lines containing a URL added in v20, so
      # Dependabot's markdown-link bodies fail body-max-line-length on it.
      # This fork runs commitlint v21 on node 26 and pins its runtime image by
      # digest, so pinning by SHA here cannot be worked around.
      - uses: yo61/commitlint-github-action@a7939ec6b16df871abcc3de81d1871da247f78a9  # v7.1.1
        with:
          configFile: commitlint.config.mjs
